openapi: 3.1.0
info:
  title: VoiceChatGLM External API
  version: 1.3.0
  description: |
    A deliberately narrow server-to-server interface to the existing protected VoiceChatGLM model path.
    The service URL is deployment-specific: set it in your own server-side configuration. No production URL is implied by this document.
servers:
  - url: /
    description: Deployment-specific API origin; substitute your approved deployment origin.
paths:
  /v1/health:
    get:
      operationId: publicHealth
      summary: Minimal external API liveness response
      responses:
        '200':
          description: API route is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          $ref: '#/components/responses/Error'
  /v1/chat:
    post:
      operationId: createChatCompletion
      summary: Generate one protected-model text completion
      description: Requires a user-created API key with the `chat:write` scope. The bearer key identifies its owner; no client user ID is accepted.
      security:
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Completion generated by the fixed protected model path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          description: Temporary technical burst/concurrency protection; inspect `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: vcg API key
  responses:
    Error:
      description: Safe machine-readable error; no credentials, database, or model internals are included.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Health:
      type: object
      required: [status, service, apiVersion]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [voicechatglm] }
        apiVersion: { type: string, enum: [v1] }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 12000 }
        max_new_tokens: { type: integer, minimum: 32, maximum: 4096, default: 768 }
        system_prompt: { type: string, maxLength: 16000 }
    ChatCompletion:
      type: object
      required: [id, object, created, model, output, usage]
      properties:
        id: { type: string, format: uuid }
        object: { type: string, enum: [chat.completion] }
        created: { type: string, format: date-time }
        model: { type: string, enum: [themodelhq/voicechatglm-qwen3-8b] }
        output:
          type: object
          required: [text]
          properties: { text: { type: string } }
        usage:
          type: object
          required: [generatedBy]
          properties: { generatedBy: { type: string, enum: [voicechatglm] } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
