[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.20.2"

# Netlify serves the React application and proxies /api/* to the single Render API.
# Keeping browser requests same-origin allows the HttpOnly session and CSRF cookies to
# remain first-party even on the default Netlify hostname. Render remains the only API.
# The proxy target is intentionally fixed; never accept a browser-supplied upstream URL.
# Set VITE_PROXY_BASE_URL=/api in Netlify's build environment.
[[redirects]]
  from = "/api/*"
  to = "https://voicechatglm.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
