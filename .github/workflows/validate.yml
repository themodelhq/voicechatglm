name: Validate VoiceChatGLM
on:
  push:
    branches:
      - fix/async-file-analysis-timeout
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Type-check and build frontend
        run: npm run build
